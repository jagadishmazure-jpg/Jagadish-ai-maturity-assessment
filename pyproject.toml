[project]
name = "ai-maturity-assessment"
version = "0.1.0"
description = "Evidence-based AI maturity assessment: a six-pillar, 29-category framework model (adapted under CC BY-SA 3.0 IGO), collectors over repositories and questionnaires, confidence-scored category levels with HITL review, gap analysis, a Month 1-12 roadmap and executive reports. Offline, mock LLM."
readme = "README.md"
license = { text = "MIT (code); CC BY-SA 3.0 IGO (framework/)" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
dependencies = [
  "jsonschema==4.26.0", # validates framework, rubric, org and evidence files
  "matplotlib==3.11.2", # radar chart in the executive report
  "mcp==2.3.0",         # assessment tools exposed as an MCP server
  "pyyaml==6.0.3",      # framework, rubric and org files are YAML
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]
azure = ["azure-identity==1.26.0", "azure-storage-blob==12.31.0"] # only the scheduled job uploads

[project.scripts]
aimaturity = "aimaturity.cli:main"
aimaturity-scheduled = "aimaturity.scheduled:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimaturity"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
