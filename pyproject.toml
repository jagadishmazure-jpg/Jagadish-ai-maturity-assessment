[project]
name = "ai-maturity-assessment"
version = "0.2.0"
description = "Evidence-based enterprise agentic AI maturity assessment: the Enterprise Agentic AI Maturity Model (8 weighted dimensions, 23 capabilities, 5 levels) mapped to NIST AI RMF, ISO/IEC 42001 and the EU AI Act, collectors over repositories and questionnaires, confidence-scored capability levels with HITL review, gap analysis, a Month 1-12 roadmap and executive reports. Offline, mock LLM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
dependencies = [
  "jsonschema==4.26.0", # validates framework, rubric, org and evidence files
  "matplotlib==3.11.2", # radar chart in the executive report
  "mcp==2.3.0",         # assessment tools exposed as an MCP server
  "pyyaml==6.0.3",      # framework, rubric and org files are YAML
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]
azure = ["azure-identity==1.27.0", "azure-storage-blob==12.31.1"] # only the scheduled job uploads

[project.scripts]
aimaturity = "aimaturity.cli:main"
aimaturity-scheduled = "aimaturity.scheduled:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimaturity"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
