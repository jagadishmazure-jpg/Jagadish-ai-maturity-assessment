# Deploy the AI maturity assessment plane: image -> dev -> (approval) -> prod, with Bicep or Terraform.
#
# GATED OFF: every job except `preflight` runs only when the repository variable
# DEPLOY_ENABLED == 'true'. It is not set, so on push to main this workflow reports the gate and
# skips. See docs/deployment.md for the one-time setup (OIDC federated credential, GitHub
# Environments `dev` and `prod` with required reviewers, Terraform state storage).
#
# Azure login is OIDC only (azure/login with a federated credential): no client secret exists.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_tool:
        description: "IaC tool"
        type: choice
        options: [terraform, bicep]
        default: terraform
      promote_to_prod:
        description: "Continue to prod after dev (prod still waits for reviewer approval)"
        type: boolean
        default: true
      location:
        description: "Azure region"
        type: string
        default: eastus2
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  DEPLOY_TOOL: ${{ inputs.deploy_tool || vars.DEPLOY_TOOL || 'terraform' }}
  LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
  TF_VERSION: "1.16.4"
  IMAGE: ghcr.io/jagadishmazure-jpg/ai-maturity-assessment
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy gate
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          {
            echo "### Deploy gate"
            echo "- DEPLOY_ENABLED: \`${ENABLED}\` (deploy jobs run only when this is true)"
            echo "- deploy tool: \`${DEPLOY_TOOL}\`, region: \`${LOCATION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ENABLED" == "true" ]] || echo "::notice::Deployment disabled (repository variable DEPLOY_ENABLED is not 'true'); deploy jobs are skipped."

  image:
    needs: preflight
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push the job image to GHCR (GITHUB_TOKEN, no stored secret)
        id: push
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${GITHUB_SHA::12}" .
          docker push "$IMAGE:${GITHUB_SHA::12}"
          echo "ref=$IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      JOB_IMAGE: ${{ needs.image.outputs.ref }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision (${{ env.DEPLOY_TOOL }})
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Smoke checks (versioned evidence store, RBAC Key Vault, scheduled job)
        env: { RESOURCE_GROUP: "${{ steps.provision.outputs.resource_group }}", STORAGE_ACCOUNT: "${{ steps.provision.outputs.storage_account }}" }
        run: .github/scripts/deploy.sh smoke
      - name: Run the job once and wait for it
        env: { RESOURCE_GROUP: "${{ steps.provision.outputs.resource_group }}", JOB_NAME: "${{ steps.provision.outputs.job_name }}" }
        run: .github/scripts/deploy.sh run-job

  deploy-prod:
    needs: [image, deploy-dev]
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.promote_to_prod)
    runs-on: ubuntu-latest
    environment: prod # required reviewers are configured on this environment
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: prod
      JOB_IMAGE: ${{ needs.image.outputs.ref }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision (${{ env.DEPLOY_TOOL }})
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Smoke checks
        env: { RESOURCE_GROUP: "${{ steps.provision.outputs.resource_group }}", STORAGE_ACCOUNT: "${{ steps.provision.outputs.storage_account }}" }
        run: .github/scripts/deploy.sh smoke
