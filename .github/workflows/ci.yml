name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Schemas and framework consistency
        run: aimaturity validate
      - name: Tests (offline, snapshot evidence, mock LLM)
        run: pytest -q
      - name: Eval gates (stability, citation completeness, calibration)
        run: |
          mkdir -p evidence
          aimaturity evals
          aimaturity evals --json > evidence/evals.json
      - name: Sample reports match a fresh run
        run: aimaturity report --all --check
      - name: Cross-repository evidence links
        run: aimaturity links --org portfolio
      - name: Doc outputs and code excerpts match a fresh run
        run: python scripts/render_docs.py --check
      - name: No PDF is tracked (source documents stay out of git)
        run: |
          if git ls-files | grep -i '\.pdf$'; then echo "::error::PDF files must not be committed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evals, path: evidence/evals.json, if-no-files-found: ignore }
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI (pinned)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: bicep build (linter runs as part of build; warnings fail the job)
        run: |
          bicep build infra/bicep/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -q "Warning" bicep.log; then exit 1; fi
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the scheduled-job image (not pushed)
        run: docker build -t ai-maturity-assessment:ci .
      - name: Run it offline
        run: docker run --rm ai-maturity-assessment:ci --out /tmp/out --org kestrel-bay-bank
