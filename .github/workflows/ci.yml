name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Schemas and framework consistency
        run: aimaturity validate
      - name: Tests (offline, snapshot evidence, mock LLM)
        run: pytest -q
      - name: Eval gates (stability, citation completeness, calibration)
        run: |
          mkdir -p evidence
          aimaturity evals
          aimaturity evals --json > evidence/evals.json
      - name: Sample reports match a fresh run
        run: aimaturity report --all --check
      - name: Cross-repository evidence links
        run: aimaturity links --org portfolio
      - name: Doc outputs and code excerpts match a fresh run
        run: python scripts/render_docs.py --check
      - name: No PDF is tracked (source documents stay out of git)
        run: |
          if git ls-files | grep -i '\.pdf$'; then echo "::error::PDF files must not be committed"; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: evals, path: evidence/evals.json, if-no-files-found: ignore }
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI (pinned)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: bicep build (linter runs as part of build; warnings fail the job)
        run: |
          bicep build infra/bicep/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -q "Warning" bicep.log; then exit 1; fi
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing of the provenance (main pushes only)
      attestations: write # store the provenance in the repo's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the scheduled-job image (not pushed)
        run: docker build -t ai-maturity-assessment:ci .
      - name: Run it offline
        run: docker run --rm ai-maturity-assessment:ci --out /tmp/out --org kestrel-bay-bank
      - name: Trivy image scan, assessment job (fixable HIGH/CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ai-maturity-assessment:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image SBOM, assessment job (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ai-maturity-assessment:ci
          format: spdx-json
          artifact-name: image-sbom-ai-maturity-assessment.spdx.json
          upload-release-assets: false
      - name: Save the image archive, assessment job (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save ai-maturity-assessment:ci -o image-ai-maturity-assessment.tar
      - name: Build provenance for the image archive, assessment job (keyless, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: image-ai-maturity-assessment.tar
      - name: Keep the attested archive for verification, assessment job (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ai-maturity-assessment.tar
          path: image-ai-maturity-assessment.tar
          retention-days: 5

  sbom:
    # Software bill of materials for the source tree (lockfiles and manifests), kept as a build
    # artifact on every run. Image SBOMs, where the repo ships a container, come from the image job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
