# Sample org 1: Jagadish Meduri's public portfolio, treated as a small AI organisation.
# Artifacts come from a read-only scan of eight sibling checkouts (snapshot below keeps CI independent of them).
# People, culture and partnership items cannot be read from code: they come from questionnaire.yaml,
# which is labelled sample-answers, so those categories score low confidence and wait for a human reviewer.
name: Jagadish Meduri portfolio
kind: Engineering portfolio (one maintainer, eight repositories)
assessor: aimaturity-agent
snapshot: evidence.json
questionnaire: questionnaire.yaml
capacity: 3
targets:
  default: 3
  pillars: {"3": 4, "5": 4}
repos:
  - {name: agentic-ai-portfolio}
  - {name: azure-agent-platform}
  - {name: azure-ai-integration-platform}
  - {name: azure-agent-labs}
  - {name: ai-learning-lab}
  - {name: fabric-enterprise-bi}
  - {name: azure-finops}
  - {name: agentic-ai-model-risk}
# Cross-links: which repository is expected to supply evidence for which categories (checked by tests).
links:
  agentic-ai-model-risk: ["5.1", "5.3", "5.5"]
  azure-finops: ["1.4", "3.2"]
  fabric-enterprise-bi: ["6.1", "6.2"]
