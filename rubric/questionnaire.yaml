# Questions for capabilities that artifacts cannot show (sponsorship, skills, adoption, some operating rhythms).
# Each answer is yes, partial or no, plus an optional note. `capability` is the first capability that uses
# the question; a question can serve several. Answers carry a source label:
#   self-reported   - answered by the organisation (weight 0.55 in confidence)
#   sample-answers  - illustrative answers used in a demo (weight 0.3; always flagged for review)
questions:
  - {id: q_exec_owner, capability: SV-1, text: "Does one executive own the agentic AI agenda and report on it regularly?"}
  - {id: q_leadership_objectives, capability: SV-1, text: "Are agentic AI outcomes part of leadership objectives and resourcing reviews?"}
  - {id: q_project_sponsors, capability: SV-1, text: "Does every live agent or AI pilot have a named senior sponsor?"}
  - {id: q_strategy_session, capability: SV-1, text: "Can agent capability proposals change business goals in strategy sessions?"}
  - {id: q_vision_in_budget, capability: SV-1, text: "Do measured agent results steer budget and prioritisation decisions?"}
  - {id: q_vision_published, capability: SV-1, text: "Is the agentic AI thesis published to staff with numeric targets?"}
  - {id: q_business_case_mandatory, capability: SV-2, text: "Is a goal-linked business case required before an agent build is funded?"}
  - {id: q_goal_field, capability: SV-2, text: "Does every agent use-case proposal state which business goal it serves?"}
  - {id: q_pilot_scaling, capability: SV-2, text: "Is there a fast, funded route from a successful agent pilot to a product?"}
  - {id: q_roadmap_refresh, capability: SV-2, text: "Is the agent roadmap refreshed from delivery data and horizon scanning?"}
  - {id: q_auto_improve, capability: SV-3, text: "Do monitoring results trigger improvement work automatically?"}
  - {id: q_intangible_value, capability: SV-3, text: "Are strategic or hard-to-price benefits of agents tracked and used to rebalance the portfolio?"}
  - {id: q_data_sharing_agreements, capability: DF-1, text: "Are strategic data assets and sharing agreements planned ahead of need?"}
  - {id: q_domain_experts, capability: DF-1, text: "Are domain experts part of each AI project?"}
  - {id: q_embedded_smes, capability: DF-1, text: "Are domain experts embedded in AI teams with a shared knowledge base?"}
  - {id: q_dq_monitoring, capability: DF-2, text: "Is data quality monitored continuously in production?"}
  - {id: q_access_process, capability: DF-3, text: "Is there a published data access request process?"}
  - {id: q_self_service_data, capability: DF-3, text: "Can AI teams get policy-compliant data access through self-service?"}
  - {id: q_synthetic_strategy, capability: DF-3, text: "Is synthetic data a standard option in the data strategy with fidelity and privacy checks?"}
  - {id: q_self_service_env, capability: PL-1, text: "Can AI teams create governed environments on their own within minutes?"}
  - {id: q_auto_retrain, capability: PL-2, text: "Are re-evaluation or retraining triggered automatically, with staged rollout?"}
  - {id: q_reuse_measured, capability: AE-2, text: "Is reuse of shared AI components funded and measured?"}
  - {id: q_affected_people, capability: AE-3, text: "Are people affected by AI involved in design and in tracking ethical outcomes?"}
  - {id: q_autonomy_tiers, capability: AE-3, text: "Is every agent assigned an autonomy tier that fixes which actions need human approval?"}
  - {id: q_agent_identity_review, capability: SI-1, text: "Are agent identities and their permissions reviewed on a cadence, with unused grants removed?"}
  - {id: q_red_team_cadence, capability: SI-2, text: "Are agents red-teamed on a schedule, with findings tracked to closure?"}
  - {id: q_erm_integration, capability: GR-1, text: "Is AI risk reported through enterprise risk management with quantitative measures?"}
  - {id: q_ethics_principles, capability: GR-1, text: "Has the organisation adopted written AI ethics principles?"}
  - {id: q_review_board, capability: GR-1, text: "Is there an AI review body with decision rights?"}
  - {id: q_audience_explanations, capability: GR-3, text: "Are explanations tailored for users, auditors and the public, with transparency notes?"}
  - {id: q_reg_watch, capability: GR-3, text: "Is regulatory change tracked proactively with owners for each obligation?"}
  - {id: q_coe, capability: PO-1, text: "Is there a chartered central AI team or centre of excellence with a mandate and reporting line?"}
  - {id: q_coordinator, capability: PO-1, text: "Is there a named AI coordinator or working group?"}
  - {id: q_operating_model_review, capability: PO-1, text: "Is the AI operating model reviewed and adjusted on a cadence?"}
  - {id: q_ai_roles_defined, capability: PO-2, text: "Are the AI roles the organisation needs named, with a skills matrix?"}
  - {id: q_awareness_material, capability: PO-2, text: "Is introductory AI material available to all staff?"}
  - {id: q_continuous_learning, capability: PO-2, text: "Is AI learning continuous and part of team routines?"}
  - {id: q_hr_integration, capability: PO-2, text: "Are AI skills part of performance, mobility and cross-skilling processes?"}
  - {id: q_role_literacy, capability: PO-2, text: "Do role-based AI literacy tracks (including ethics) run with completion tracking?"}
  - {id: q_training_paths, capability: PO-2, text: "Do AI roles have funded training paths and appear in workforce planning?"}
  - {id: q_change_method, capability: PO-3, text: "Is a change method with stakeholder analysis and adoption metrics applied?"}
  - {id: q_ecosystem_lead, capability: PO-3, text: "Does the organisation help lead its AI ecosystem or contribute shared assets?"}
  - {id: q_feedback_loop, capability: PO-3, text: "Is user feedback collected continuously and fed into the backlog?"}
  - {id: q_partnership_formal, capability: PO-3, text: "Are there formal AI partnerships with goals (academia, peers, vendors)?"}
  - {id: q_partnership_informal, capability: PO-3, text: "Does the organisation take part in AI communities or peer networks?"}
  - {id: q_rollout_comms, capability: PO-3, text: "Do agent rollouts come with communication and training for the people who use them?"}
  - {id: q_cost_optimisation_cadence, capability: FC-1, text: "Is cloud cost and performance for AI reviewed and optimised on a cadence?"}
  - {id: q_model_routing, capability: FC-2, text: "Are requests routed between models by measured cost, latency and quality per task?"}
