# Evidence rules per capability (this repository's own rubric, MIT licensed).
#
# Each level from 2 (Prove) to 5 (Optimise) lists `must` criteria and optional `support` criteria. A
# capability reaches level N when it reached level N-1, every `must` criterion is fully present (a
# partial answer does not satisfy a must) and at least `support_share` of the `support` criteria are
# present (a partial answer counts half). A level with no support criteria is decided by its musts.
# Level 1 (Explore) needs nothing. Each evidence signal decides one capability at one level, so missing
# one artifact moves one capability, not several. The exceptions are deliberate: some level 4 signals
# also gate level 5 of the same capability, and the two unit-value signals are shared by SV-3 and FC-2.
#
# Evidence ceiling: every `must` list at levels 4 and 5 contains at least one artifact signal, so
# questionnaire answers alone can lift a capability to Operate (3) and no further. The consistency
# check in src/aimaturity/framework.py enforces this.
#
# Effort per step: S (about a month), M (two), L (three). Anchors cap their dimension: a dimension
# cannot sit more than one level above its weakest anchor capability.
support_share: 0.5
ceiling_from: 4
anchors: [SV-1, DF-2, PL-2, AE-1, SI-1, GR-1, PO-1, FC-1]
