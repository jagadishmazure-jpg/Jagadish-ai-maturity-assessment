# Evidence rules per capability (this repository's own rubric, MIT licensed).
#
# Each level from 2 (Prove) to 5 (Optimise) lists `must` criteria and `support` criteria. A capability
# reaches level N when it reached level N-1, every `must` criterion is fully present (a partial answer
# does not satisfy a must) and the present share of `support` criteria is at least `support_share`
# (a partial answer counts half). Level 1 (Explore) needs nothing.
#
# Evidence ceiling: every `must` list at levels 4 and 5 contains at least one artifact signal, so
# questionnaire answers alone can lift a capability to Operate (3) and no further. The consistency
# check in src/aimaturity/framework.py enforces this.
#
# Effort per step: S (about a month), M (two), L (three). Anchors cap their dimension: a dimension
# cannot sit more than one level above its weakest anchor capability.
support_share: 0.5
ceiling_from: 4
anchors: [SV-1, DF-2, PL-2, AE-1, SI-1, GR-1, PO-1, FC-1]
capabilities:
  SV-1:
    levels:
      2: {must: [vision_statement], support: [q_project_sponsors]}
      3: {must: [vision_targets], support: [q_vision_published, q_exec_owner]}
      4: {must: [strategy_review], support: [q_vision_in_budget]}
      5: {must: [strategy_review, scouting], support: [q_strategy_session, q_leadership_objectives]}
    effort: {2: S, 3: M, 4: M, 5: L}
    depends_on: []
  SV-2:
    levels:
      2: {must: [business_case], support: [experiments, q_goal_field]}
      3: {must: [roadmap_doc], support: [q_business_case_mandatory]}
      4: {must: [roadmap_owned, adr], support: [q_roadmap_refresh]}
      5: {must: [experiment_writeups], support: [scouting, q_pilot_scaling]}
    effort: {2: S, 3: S, 4: M, 5: L}
    depends_on: [SV-1]
  SV-3:
    levels:
      2: {must: [value_metrics], support: [business_case]}
      3: {must: [value_tracking_code], support: []}
      4: {must: [business_metric_link], support: [q_intangible_value]}
      5: {must: [business_metric_link, strategy_review], support: [q_auto_improve]}
    effort: {2: S, 3: M, 4: L, 5: L}
    depends_on: [SV-2]
  DF-1:
