  SV-1:
    levels:
      2: {must: [vision_statement], support: [q_goal_field]}
      3: {must: [vision_targets], support: [q_vision_published]}
      4: {must: [strategy_review], support: [q_vision_in_budget]}
      5: {must: [scouting, q_strategy_session], support: []}
    effort: {2: S, 3: M, 4: M, 5: L}
    depends_on: []
