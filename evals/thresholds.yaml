# Eval gates for the assessor. CI fails when any gate misses its threshold.
stability:
  shuffle_runs: 5               # evidence order shuffled this many times per org
  identical_required: true      # every shuffled run must give identical levels and confidence
  # Dropout: remove one evidence item at a time and rescore.
  # Locality is always enforced: only capabilities that use the removed item's signal may move.
  # Levels are stepwise (a level needs the one below), so losing a foundation artifact can drop a
  # capability several levels; that size is reported, not gated. What is gated is how often it happens.
  dropout_max_capabilities: 2     # one removed item may move at most this many capabilities
  dropout_mean_capabilities: 0.5  # mean capabilities moved per removed item
citations:
  completeness_min: 1.0         # share of level >= 2 capabilities with cited evidence
  valid_ids_min: 1.0            # share of cited ids that exist
  verifier_catch_min: 1.0       # share of injected bad rationales (hallucinated id, overclaimed level) caught
calibration:
  synthetic_orgs: 12
  seed: 7
  exact_min: 0.80               # agreement with labelled levels
  within_one_min: 0.97
  high_conf_not_worse: true     # accuracy where confidence >= 0.6 must be >= accuracy below it
